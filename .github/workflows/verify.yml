name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    name: Lint, typecheck, test, build, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-secrets --history
      - run: pnpm --filter @khata-club/storybook exec playwright install --with-deps chromium firefox webkit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:package
      - name: Check generated public types
        run: git diff --exit-code -- packages/api-client/src/generated/schema.ts
