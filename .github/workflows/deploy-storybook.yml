name: Deploy Storybook

on:
  push:
    branches: ["main"]
  # Supports manual deployment after a Pages setting change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run one complete deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/configure-pages@v5
        id: pages

      - run: pnpm install --frozen-lockfile

      # `@khata-club/ui` resolves to its `dist/`, which the preview imports.
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@khata-club/storybook^...

      - name: Build Storybook
        # Pages serves the site from /<repo>/, so every asset URL needs that
        # prefix. `.storybook/main.ts` reads this and sets Vite's `base`.
        env:
          STORYBOOK_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm --filter @khata-club/storybook build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storybook/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
