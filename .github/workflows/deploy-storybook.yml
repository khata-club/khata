name: Deploy Storybook

on:
  push:
    branches: ["main"]
  # Supports manual deployment after a Pages setting change.
  workflow_dispatch:

permissions:
  contents: read

# Run one complete deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        id: pages

      - run: pnpm install --frozen-lockfile

      # `@khata-club/ui` resolves to its `dist/`, which the preview imports.
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@khata-club/storybook^...

      - name: Build Storybook
        # Pages serves the site from /<repo>/, so every asset URL needs that
        # prefix. `.storybook/main.ts` reads this and sets Vite's `base`.
        env:
          STORYBOOK_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm --filter @khata-club/storybook build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/storybook/storybook-static

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
